####################################
# Transfer language configuration
#################################### 

version: 1.0.2
tasks:
  # Transfer language task transfers files to members without building. Reports files as
  # build outputs in the build report.
  - language: Transfer

    # Source file association patterns
    # Can be used for JCL, PROC, CNTL, REXX and any other type of source code which needs
    # to be packaged and processed by the pipeline. 
    sources:
      - "**/src/base/**/*.jcl"
      - "**/src/base/**/*.proc"
      - "**/src/base/**/*.cntl"
      - "**/src/base/**/*.rexx"

    # Dataset allocation options
    datasets:
      - name: ${HLQ}.JCL
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.PROC
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.CNTL
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.REXX
        options: cyl space(1,1) lrecl(255) dsorg(PO) recfm(V,B) dsntype(library)
    
    # Single copy step for each file type
    # copyMode: BINARY - fontes convertidos para IBM-1047 (EBCDIC) pelo gitClone.sh.
    # Com BINARY o DBB copia bytes diretamente sem conversao de codepage,
    # evitando EDC5003I Truncation com AUTOCVT=ON + copyMode:TEXT.
    steps:
      - step: copyJCL
        type: copy
        condition: ${FILE_EXT} == "jcl"
        target: //'${HLQ}.JCL(${MEMBER})'
        copyMode: BINARY
        deployType: JCL

      - step: copyPROC
        type: copy
        condition: ${FILE_EXT} == "proc"
        target: //'${HLQ}.PROC(${MEMBER})'
        copyMode: BINARY
        deployType: PROC

      - step: copyCNTL
        type: copy
        condition: ${FILE_EXT} == "cntl"
        target: //'${HLQ}.CNTL(${MEMBER})'
        copyMode: BINARY
        deployType: CNTL

      - step: copyREXX
        type: copy
        condition: ${FILE_EXT} == "rexx"
        target: //'${HLQ}.REXX(${MEMBER})'
        copyMode: BINARY
        deployType: REXX
    
