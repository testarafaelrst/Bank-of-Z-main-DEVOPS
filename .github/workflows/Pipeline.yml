name: boz-pipeline

# =============================================================================
# Bank of Z — Full DevOps Pipeline
#
# Executes the complete CI/CD pipeline on z/OS USS:
#   1. ZCodeScan  — static analysis (TAZ)
#   2. DBB Build  — impact/pipeline build via composite action dbb-build
#   3. Wazi Deploy — generate + deploy (WASI)
#   4. Verify     — post-install verification tests
#
# Triggers:
#   - Push to main or release/* branches
#   - Pull Request targeting main (impact build only, no deploy)
#   - Manual dispatch (workflow_dispatch) — allows choosing build type
#
# Required repository variables (Settings > Variables):
#   ZOS_HOST          — z/OS USS hostname for SSH
#   ZOS_SSH_PORT      — porta SSH do z/OS (default: 22)
#   ZOS_SANDBOX_DIR   — base sandbox directory on z/OS USS
#   BOZ_FRONTEND_URL  — Bank of Z frontend URL (e.g. http://<host>:9081)
#   BOZ_BUILD_HLQ     — HLQ destino dos artefatos compilados (ex: BANKZ)
#
# Required repository secrets (Settings > Secrets):
#   ZOS_SSH_KEY       — chave privada SSH para autenticação no z/OS
#   GH_ACTIONS_PAT    — GitHub Personal Access Token para git clone no z/OS
# =============================================================================

on:
    # push desabilitado temporariamente — habilitar quando z/OS estiver pronto para pipeline completo
    # push:
    #     branches:
    #         - main
    #         - "release/**"
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
    workflow_dispatch:
        inputs:
            buildType:
                description: "DBB build type (pipeline = impact, full = rebuild all)"
                required: false
                default: "pipeline"
                type: choice
                options:
                    - pipeline
                    - full

env:
    uniqueWorkspaceId: ${{ vars.ZOS_SANDBOX_DIR }}/pipeline/${{ github.repository }}/${{ github.ref_name }}/run_${{ github.run_number }}
    branch: ${{ github.ref_name }}
    application: ${{ github.event.repository.name }}
    zosHost: ${{ vars.ZOS_HOST }}
    zosPort: ${{ vars.ZOS_SSH_PORT || '22' }}
    bozFrontendUrl: ${{ vars.BOZ_FRONTEND_URL }}
    buildHlq: ${{ vars.BOZ_BUILD_HLQ }}
    # For PRs always use impact build; push/dispatch honours input (default: pipeline)
    buildType: ${{ github.event_name == 'pull_request' && 'pipeline' || (github.event.inputs.buildType || 'pipeline') }}
    # Deploy only on push to main/release — not on PRs
    runDeploy: ${{ github.event_name != 'pull_request' }}

jobs:
    # -------------------------------------------------------------------------
    # 1. Print pipeline parameters
    # -------------------------------------------------------------------------
    controller:
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: pipeline-parameters
              run: |
                  echo " "
                  echo "Bank of Z — Full DevOps Pipeline"
                  echo "*******************************************"
                  echo "Run ID          = ${{ github.run_number }}"
                  echo "Trigger         = ${{ github.event_name }}"
                  echo "Branch          = ${{ env.branch }}"
                  echo "Application     = ${{ env.application }}"
                  echo "z/OS Host       = ${{ env.zosHost }}"
                  echo "Workspace       = ${{ env.uniqueWorkspaceId }}"
                  echo "Build type      = ${{ env.buildType }}"
                  echo "Deploy enabled  = ${{ env.runDeploy }}"

    # -------------------------------------------------------------------------
    # 2. Cleanup z/OS USS disk before clone
    # -------------------------------------------------------------------------
    cleanup:
        needs: controller
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-old-workspaces
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  CURRENT_RUN="run_${{ github.run_number }}"
                  ssh -i "$KEY_FILE" \
                      -p ${{ env.zosPort }} \
                      -o StrictHostKeyChecking=no \
                      ${{ vars.ZOS_SSH_USER }}@${{ env.zosHost }} << ENDSSH
                    set +e
                    SANDBOX="${{ vars.ZOS_SANDBOX_DIR }}"
                    REPO="${{ github.repository }}"
                    BRANCH="${{ env.branch }}"

                    echo "=== DISCO ANTES DA LIMPEZA ==="
                    df -k "\$SANDBOX" 2>/dev/null || df -k /

                    echo "=== LIMPANDO pipeline runs anteriores ==="
                    find "\$SANDBOX/pipeline/\$REPO/\$BRANCH" \
                      -maxdepth 1 -name 'run_*' -type d \
                      ! -name "${CURRENT_RUN}" \
                      -exec rm -rf {} \; 2>/dev/null || true

                    echo "=== LIMPANDO batch-pipeline runs anteriores ==="
                    find "\$SANDBOX/batch-pipeline/\$REPO/\$BRANCH" \
                      -maxdepth 1 -name 'run_*' -type d \
                      -exec rm -rf {} \; 2>/dev/null || true

                    echo "=== LIMPANDO ZIPs orfaos em /tmp ==="
                    find /tmp -maxdepth 1 -name 'repo_*.zip' -exec rm -f {} \; 2>/dev/null || true

                    echo "=== DISCO APOS LIMPEZA ==="
                    df -k "\$SANDBOX" 2>/dev/null || df -k /

                    echo "[OK] Cleanup concluido"
                  ENDSSH
                  rm -f "$KEY_FILE"

    # -------------------------------------------------------------------------
    # 3. Clone repository to z/OS USS
    # -------------------------------------------------------------------------
    clone:
        needs: cleanup
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: clone-repository-to-uss
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no \
                    ${{ vars.ZOS_SSH_USER }}@${{ env.zosHost }} \
                    ". ~/.profile && gitClone.sh \
                      -w ${{ env.uniqueWorkspaceId }} \
                      -r https://${{ secrets.GH_ACTIONS_PAT }}@github.com/${{ github.repository }}.git \
                      -b ${{ env.branch }}"
                  rm -f "$KEY_FILE"

    # -------------------------------------------------------------------------
    # 3. ZCodeScan — static analysis (TAZ)
    # -------------------------------------------------------------------------
    static-scan:
        needs: clone
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: run-zcodescan
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no \
                    ${{ vars.ZOS_SSH_USER }}@${{ env.zosHost }} \
                    ". ~/.profile &&
                    REPO_DIR=${{ env.uniqueWorkspaceId }}/Bank-of-Z &&
                    cd \$REPO_DIR &&
                    export BANK_OF_Z_WORK_DIR=${{ env.uniqueWorkspaceId }} &&
                    bash .setup/pipeline-common.sh scan"
                  rm -f "$KEY_FILE"

    # -------------------------------------------------------------------------
    # 4. DBB Build — composite action
    # -------------------------------------------------------------------------
    build:
        needs: static-scan
        runs-on: [self-hosted, macOS, ARM64]
        outputs:
            build-artifact-path: ${{ steps.dbb.outputs.build-artifact-path }}
            logs-artifact-path: ${{ steps.dbb.outputs.logs-artifact-path }}
        steps:
            - name: run-dbb-build
              id: dbb
              uses: ./.github/actions/dbb-build
              with:
                  ssh-host: ${{ env.zosHost }}
                  ssh-port: ${{ env.zosPort }}
                  ssh-user: ${{ vars.ZOS_SSH_USER }}
                  ssh-private-key: ${{ secrets.ZOS_SSH_KEY }}
                  unique-workspace-id: ${{ env.uniqueWorkspaceId }}
                  build-hlq: ${{ env.buildHlq }}
                  gh-token: ${{ secrets.GH_ACTIONS_PAT }}
                  pipeline-type: build
                  dbb-build-type: ${{ env.buildType }}
                  include-logs: "*.log,*.lst"

    # -------------------------------------------------------------------------
    # 5. TAZ — testes automatizados pós-build
    #    Valida DEVOPSPL (RC=0 happy path) e cenários de falha controlada.
    #    Executa em PRs e em push — é pré-requisito do deploy.
    # -------------------------------------------------------------------------
    taz-test:
        name: "5/7 — TAZ: Testes Automatizados"
        needs: build
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: run-taz-tests
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  ssh -i "$KEY_FILE" \
                      -p ${{ env.zosPort }} \
                      -o StrictHostKeyChecking=no \
                      ${{ vars.ZOS_SSH_USER }}@${{ env.zosHost }} << 'ENDSSH'
                    set -e
                    . ~/.profile
                    REPO_DIR="${{ env.uniqueWorkspaceId }}/${{ env.application }}"
                    cd "$REPO_DIR"
                    export BANK_OF_Z_WORK_DIR="${{ env.uniqueWorkspaceId }}"
                    bash .setup/pipeline-common.sh test
                  ENDSSH
                  rm -f "$KEY_FILE"

    # -------------------------------------------------------------------------
    # 6. Wazi Deploy — generate + deploy (WASI)
    #    Skipped on Pull Requests (deploy only to main/release)
    # -------------------------------------------------------------------------
    deploy:
        needs: taz-test
        runs-on: [self-hosted, macOS, ARM64]
        if: ${{ github.event_name != 'pull_request' }}
        steps:
            - name: run-wazi-deploy
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no \
                    ${{ vars.ZOS_SSH_USER }}@${{ env.zosHost }} \
                    ". ~/.profile &&
                    REPO_DIR=${{ env.uniqueWorkspaceId }}/${{ env.application }} &&
                    cd \$REPO_DIR &&
                    export BANK_OF_Z_WORK_DIR=${{ env.uniqueWorkspaceId }} &&
                    bash .setup/pipeline-common.sh deploy"
                  rm -f "$KEY_FILE"

    # -------------------------------------------------------------------------
    # 7. Post-install verification tests
    #    Runs after deploy (main/release) or after taz-test (PR, deploy skipped)
    # -------------------------------------------------------------------------
    verify:
        needs:
            - taz-test
            - deploy
        runs-on: [self-hosted, macOS, ARM64]
        if: ${{ always() && needs.taz-test.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        steps:
            - name: run-verification-tests
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no \
                    ${{ vars.ZOS_SSH_USER }}@${{ env.zosHost }} \
                    ". ~/.profile &&
                    REPO_DIR=${{ env.uniqueWorkspaceId }}/${{ env.application }} &&
                    cd \$REPO_DIR &&
                    export BANK_OF_Z_WORK_DIR=${{ env.uniqueWorkspaceId }} &&
                    bash .setup/pipeline-common.sh verify"
                  rm -f "$KEY_FILE"
