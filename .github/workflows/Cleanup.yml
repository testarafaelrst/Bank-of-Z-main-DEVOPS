name: boz-cleanup

# =============================================================================
# Bank of Z — Limpeza de Workspaces no z/OS USS
#
# Remove todos os diretórios run_* acumulados no z/OS USS para liberar espaço.
# Disparar manualmente quando o disco estiver cheio.
#
# Required repository variables: ZOS_HOST, ZOS_SSH_USER, ZOS_SSH_PORT, ZOS_SANDBOX_DIR
# Required repository secrets:   ZOS_SSH_KEY
# =============================================================================

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar (batch-pipeline ou pipeline)"
                required: false
                default: "batch-pipeline"
                type: choice
                options:
                    - batch-pipeline
                    - pipeline
                    - all
            keep_last:
                description: "Número de runs mais recentes a manter (0 = remove todos)"
                required: false
                default: "0"

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "${{ secrets.ZOS_SSH_KEY }}" > "$KEY_FILE"
                  SSH_OPTS="-i $KEY_FILE -p ${{ vars.ZOS_SSH_PORT || '22' }} -o StrictHostKeyChecking=no"
                  KEEP="${{ github.event.inputs.keep_last || '0' }}"
                  PIPELINE="${{ github.event.inputs.pipeline || 'batch-pipeline' }}"
                  SANDBOX="${{ vars.ZOS_SANDBOX_DIR }}"
                  REPO="${{ github.repository }}"

                  ssh $SSH_OPTS ${{ vars.ZOS_SSH_USER }}@${{ vars.ZOS_HOST }} << ENDSSH
                    set +e

                    cleanup_branch() {
                      local base="\$1"
                      local keep="\$2"
                      echo "[INFO] Limpando: \$base (keep=\$keep)"
                      if [ ! -d "\$base" ]; then
                        echo "[SKIP] Diretório não existe: \$base"
                        return
                      fi
                      if [ "\$keep" -eq 0 ]; then
                        find "\$base" -maxdepth 1 -name 'run_*' -type d -exec rm -rf {} \; 2>/dev/null
                      else
                        find "\$base" -maxdepth 1 -name 'run_*' -type d | sort -V | head -n -\$keep | xargs -r rm -rf 2>/dev/null
                      fi
                      echo "[OK] Limpeza concluída em \$base"
                    }

                    if [ "$PIPELINE" = "all" ]; then
                      cleanup_branch "${SANDBOX}/batch-pipeline/${REPO}/main" "$KEEP"
                      cleanup_branch "${SANDBOX}/pipeline/${REPO}/main" "$KEEP"
                    else
                      cleanup_branch "${SANDBOX}/${PIPELINE}/${REPO}/main" "$KEEP"
                    fi

                    echo ""
                    echo "[INFO] Uso de disco após limpeza:"
                    df -k "${SANDBOX}" 2>/dev/null || df -k / 2>/dev/null
                  ENDSSH

                  rm -f "$KEY_FILE"
