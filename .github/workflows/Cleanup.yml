name: boz-cleanup

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - batch-pipeline
                    - pipeline

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              env:
                  ZOS_SSH_KEY: ${{ secrets.ZOS_SSH_KEY }}
                  ZOS_HOST: ${{ vars.ZOS_HOST }}
                  ZOS_PORT: ${{ vars.ZOS_SSH_PORT || '22' }}
                  ZOS_USER: ${{ vars.ZOS_SSH_USER }}
                  SANDBOX: ${{ vars.ZOS_SANDBOX_DIR }}
                  REPO: ${{ github.repository }}
                  PIPELINE: ${{ github.event.inputs.pipeline || 'all' }}
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "$ZOS_SSH_KEY" > "$KEY_FILE"

                  # Escreve o script em um arquivo temporário local
                  SCRIPT_FILE=$(mktemp)
                  cat > "$SCRIPT_FILE" << ENDSCRIPT
                  set +e
                  SANDBOX="$SANDBOX"
                  REPO="$REPO"
                  echo "SANDBOX=\$SANDBOX"
                  echo "REPO=\$REPO"
                  echo ""
                  echo "=== DISCO ANTES ==="
                  df -k "\$SANDBOX" 2>/dev/null || df -k /
                  echo ""
                  echo "=== TOP 10 MAIORES ITENS ==="
                  du -sk "\$SANDBOX"/*/ 2>/dev/null | sort -rn | head -10
                  echo ""
                  echo "=== REMOVENDO runs em batch-pipeline ==="
                  find "\$SANDBOX/batch-pipeline" -maxdepth 5 -name "run_*" -type d -exec rm -rf {} + 2>/dev/null; echo "done"
                  echo "=== REMOVENDO runs em pipeline ==="
                  find "\$SANDBOX/pipeline" -maxdepth 5 -name "run_*" -type d -exec rm -rf {} + 2>/dev/null; echo "done"
                  echo "=== REMOVENDO temporarios /tmp ==="
                  rm -f /tmp/repo_*.zip /tmp/dbb_build_*.log /tmp/zcodescan_*.log 2>/dev/null; echo "done"
                  echo ""
                  echo "=== DISCO APOS LIMPEZA ==="
                  df -k "\$SANDBOX" 2>/dev/null || df -k /
                  df -k /tmp 2>/dev/null
                  echo "[OK] Cleanup concluido"
                  ENDSCRIPT

                  # Envia o script via SCP e executa via SSH
                  REMOTE_TMP="/tmp/boz_cleanup_$$.sh"
                  scp -i "$KEY_FILE" -P "$ZOS_PORT" -o StrictHostKeyChecking=no \
                    "$SCRIPT_FILE" "$ZOS_USER@$ZOS_HOST:$REMOTE_TMP"

                  ssh -i "$KEY_FILE" -p "$ZOS_PORT" -o StrictHostKeyChecking=no \
                    "$ZOS_USER@$ZOS_HOST" \
                    "chmod +x $REMOTE_TMP && bash $REMOTE_TMP; rm -f $REMOTE_TMP"

                  rm -f "$KEY_FILE" "$SCRIPT_FILE"
