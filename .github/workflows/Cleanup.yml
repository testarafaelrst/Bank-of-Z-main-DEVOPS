name: boz-cleanup

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - batch-pipeline
                    - pipeline

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              env:
                  ZOS_SSH_KEY: ${{ secrets.ZOS_SSH_KEY }}
                  ZOS_HOST: ${{ vars.ZOS_HOST }}
                  ZOS_PORT: ${{ vars.ZOS_SSH_PORT || '22' }}
                  ZOS_USER: ${{ vars.ZOS_SSH_USER }}
                  SANDBOX: ${{ vars.ZOS_SANDBOX_DIR }}
                  REPO: ${{ github.repository }}
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "$ZOS_SSH_KEY" > "$KEY_FILE"
                  SSH="ssh -i $KEY_FILE -p $ZOS_PORT -o StrictHostKeyChecking=no $ZOS_USER@$ZOS_HOST"

                  # Diagnóstico: ver o que realmente está ocupando espaço
                  $SSH ". ~/.profile 2>/dev/null; \
                    echo '=== CONTEUDO batch-pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS ==='; \
                    ls -la ${SANDBOX}/batch-pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS/ 2>/dev/null; \
                    echo '=== CONTEUDO pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS ==='; \
                    ls -la ${SANDBOX}/pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS/ 2>/dev/null; \
                    echo '=== DU TOP 5 batch-pipeline ==='; \
                    du -sk ${SANDBOX}/batch-pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS/*/ 2>/dev/null | sort -rn | head -5; \
                    echo '=== DU TOP 5 pipeline ==='; \
                    du -sk ${SANDBOX}/pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS/*/ 2>/dev/null | sort -rn | head -5; \
                    echo OK"

                  rm -f "$KEY_FILE"
