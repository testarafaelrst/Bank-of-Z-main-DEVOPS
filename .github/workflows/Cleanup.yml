name: boz-cleanup

# =============================================================================
# Bank of Z — Limpeza de Workspaces no z/OS USS
#
# Remove todos os diretórios run_* acumulados no z/OS USS para liberar espaço.
# Disparar manualmente quando o disco estiver cheio.
#
# Required repository variables: ZOS_HOST, ZOS_SSH_USER, ZOS_SSH_PORT, ZOS_SANDBOX_DIR
# Required repository secrets:   ZOS_SSH_KEY
# =============================================================================

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - batch-pipeline
                    - pipeline

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              env:
                  ZOS_SSH_KEY: ${{ secrets.ZOS_SSH_KEY }}
                  ZOS_HOST: ${{ vars.ZOS_HOST }}
                  ZOS_PORT: ${{ vars.ZOS_SSH_PORT || '22' }}
                  ZOS_USER: ${{ vars.ZOS_SSH_USER }}
                  SANDBOX: ${{ vars.ZOS_SANDBOX_DIR }}
                  REPO: ${{ github.repository }}
                  PIPELINE: ${{ github.event.inputs.pipeline || 'all' }}
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "$ZOS_SSH_KEY" > "$KEY_FILE"

                  ssh -i "$KEY_FILE" -p "$ZOS_PORT" -o StrictHostKeyChecking=no \
                    "$ZOS_USER@$ZOS_HOST" \
                    "SANDBOX='$SANDBOX' REPO='$REPO' PIPELINE='$PIPELINE' sh -s" << 'SCRIPT'
                    set +e
                    echo "=== SANDBOX: $SANDBOX ==="
                    echo "=== REPO:    $REPO ==="
                    echo "=== PIPELINE: $PIPELINE ==="

                    echo ""
                    echo "=== DISCO ANTES DA LIMPEZA ==="
                    df -k "$SANDBOX" 2>/dev/null || df -k /

                    echo ""
                    echo "=== TOP 10 MAIORES ITENS ==="
                    du -sk "$SANDBOX"/*/ 2>/dev/null | sort -rn | head -10

                    do_cleanup() {
                      base="$1"
                      echo "[INFO] Limpando: $base"
                      if [ ! -d "$base" ]; then
                        echo "[SKIP] Nao existe: $base"
                        return
                      fi
                      find "$base" -maxdepth 2 -name 'run_*' -type d -exec rm -rf {} \; 2>/dev/null
                      echo "[OK] Limpo: $base"
                    }

                    echo ""
                    echo "=== LIMPANDO WORKSPACES ==="
                    if [ "$PIPELINE" = "all" ] || [ "$PIPELINE" = "batch-pipeline" ]; then
                      do_cleanup "$SANDBOX/batch-pipeline/$REPO/main"
                    fi
                    if [ "$PIPELINE" = "all" ] || [ "$PIPELINE" = "pipeline" ]; then
                      do_cleanup "$SANDBOX/pipeline/$REPO/main"
                    fi

                    echo ""
                    echo "=== LIMPANDO /tmp ==="
                    find /tmp -maxdepth 1 -name 'repo_*.zip' -exec rm -f {} \; 2>/dev/null || true
                    find /tmp -maxdepth 1 -name 'zcodescan_*.log' -exec rm -f {} \; 2>/dev/null || true
                    find /tmp -maxdepth 1 -name 'dbb_build_*.log' -exec rm -f {} \; 2>/dev/null || true

                    echo ""
                    echo "=== DISCO APOS LIMPEZA ==="
                    df -k "$SANDBOX" 2>/dev/null || df -k /
                    df -k /tmp 2>/dev/null

                    echo "[OK] Cleanup concluido"
                  SCRIPT

                  rm -f "$KEY_FILE"
