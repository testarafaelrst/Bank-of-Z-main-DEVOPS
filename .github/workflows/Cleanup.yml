name: boz-cleanup

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - batch-pipeline
                    - pipeline

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              env:
                  ZOS_SSH_KEY: ${{ secrets.ZOS_SSH_KEY }}
                  ZOS_HOST: ${{ vars.ZOS_HOST }}
                  ZOS_PORT: ${{ vars.ZOS_SSH_PORT || '22' }}
                  ZOS_USER: ${{ vars.ZOS_SSH_USER }}
                  SANDBOX: ${{ vars.ZOS_SANDBOX_DIR }}
                  REPO: ${{ github.repository }}
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "$ZOS_SSH_KEY" > "$KEY_FILE"
                  SSH="ssh -i $KEY_FILE -p $ZOS_PORT -o StrictHostKeyChecking=no $ZOS_USER@$ZOS_HOST"

                  # Limpa todos os runs dentro de main/ — path completo conhecido
                  $SSH ". ~/.profile 2>/dev/null; \
                    echo '=== DISCO ANTES ==='; \
                    df -k ${SANDBOX} 2>/dev/null; \
                    echo '=== REMOVENDO batch-pipeline/main/* ==='; \
                    rm -rf ${SANDBOX}/batch-pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS/main/run_*; echo done; \
                    echo '=== REMOVENDO pipeline/main/* ==='; \
                    rm -rf ${SANDBOX}/pipeline/testarafaelrst/Bank-of-Z-main-DEVOPS/main/run_*; echo done; \
                    echo '=== REMOVENDO /tmp temporarios ==='; \
                    rm -f /tmp/repo_*.zip /tmp/dbb_build_*.log /tmp/zcodescan_*.log 2>/dev/null; echo done; \
                    echo '=== DISCO APOS ==='; \
                    df -k ${SANDBOX} 2>/dev/null; \
                    echo OK"

                  rm -f "$KEY_FILE"
