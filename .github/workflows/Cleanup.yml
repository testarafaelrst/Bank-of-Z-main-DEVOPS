name: boz-cleanup

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - batch-pipeline
                    - pipeline

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              env:
                  ZOS_SSH_KEY: ${{ secrets.ZOS_SSH_KEY }}
                  ZOS_HOST: ${{ vars.ZOS_HOST }}
                  ZOS_PORT: ${{ vars.ZOS_SSH_PORT || '22' }}
                  ZOS_USER: ${{ vars.ZOS_SSH_USER }}
                  SANDBOX: ${{ vars.ZOS_SANDBOX_DIR }}
                  REPO: ${{ github.repository }}
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "$ZOS_SSH_KEY" > "$KEY_FILE"
                  SSH="ssh -i $KEY_FILE -p $ZOS_PORT -o StrictHostKeyChecking=no $ZOS_USER@$ZOS_HOST"

                  # Diagnóstico: listar estrutura real dos diretórios
                  $SSH ". ~/.profile 2>/dev/null; \
                    echo '=== ESTRUTURA batch-pipeline ==='; \
                    ls -la ${SANDBOX}/batch-pipeline/ 2>/dev/null; \
                    ls -la ${SANDBOX}/batch-pipeline/*/ 2>/dev/null | head -30; \
                    echo '=== ESTRUTURA pipeline ==='; \
                    ls -la ${SANDBOX}/pipeline/ 2>/dev/null; \
                    ls -la ${SANDBOX}/pipeline/*/ 2>/dev/null | head -30; \
                    echo '=== FIND run_ ==='; \
                    find ${SANDBOX} -maxdepth 6 -name 'run_*' -type d 2>/dev/null; \
                    echo OK"

                  rm -f "$KEY_FILE"
