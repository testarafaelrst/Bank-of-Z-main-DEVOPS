name: boz-cleanup

on:
    workflow_dispatch:
        inputs:
            pipeline:
                description: "Pipeline a limpar"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - batch-pipeline
                    - pipeline

jobs:
    cleanup:
        name: "Limpeza de Workspaces z/OS USS"
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - name: cleanup-workspaces
              env:
                  ZOS_SSH_KEY: ${{ secrets.ZOS_SSH_KEY }}
                  ZOS_HOST: ${{ vars.ZOS_HOST }}
                  ZOS_PORT: ${{ vars.ZOS_SSH_PORT || '22' }}
                  ZOS_USER: ${{ vars.ZOS_SSH_USER }}
                  SANDBOX: ${{ vars.ZOS_SANDBOX_DIR }}
                  REPO: ${{ github.repository }}
                  PIPELINE: ${{ github.event.inputs.pipeline || 'all' }}
              run: |
                  KEY_FILE=$(mktemp) && chmod 600 "$KEY_FILE"
                  echo "$ZOS_SSH_KEY" > "$KEY_FILE"

                  # Monta o script como string no runner macOS e passa via stdin
                  # Sem heredoc — evita qualquer problema de expansão de variáveis
                  REMOTE_SCRIPT="
                  set +e
                  SANDBOX='$SANDBOX'
                  REPO='$REPO'
                  PIPELINE='$PIPELINE'

                  echo '=== SANDBOX='
                  echo \$SANDBOX
                  echo '=== REPO='
                  echo \$REPO
                  echo '=== PIPELINE='
                  echo \$PIPELINE

                  echo ''
                  echo '=== DISCO ANTES ==='
                  df -k \$SANDBOX 2>/dev/null || df -k /

                  echo ''
                  echo '=== TOP 10 MAIORES ITENS ==='
                  du -sk \$SANDBOX/*/ 2>/dev/null | sort -rn | head -10

                  echo ''
                  echo '=== REMOVENDO run_* em batch-pipeline ==='
                  find \$SANDBOX/batch-pipeline -maxdepth 4 -name 'run_*' -type d -exec rm -rf {} + 2>/dev/null || true

                  echo '=== REMOVENDO run_* em pipeline ==='
                  find \$SANDBOX/pipeline -maxdepth 4 -name 'run_*' -type d -exec rm -rf {} + 2>/dev/null || true

                  echo '=== REMOVENDO /tmp/repo_*.zip ==='
                  rm -f /tmp/repo_*.zip /tmp/dbb_build_*.log /tmp/zcodescan_*.log 2>/dev/null || true

                  echo ''
                  echo '=== DISCO APOS LIMPEZA ==='
                  df -k \$SANDBOX 2>/dev/null || df -k /
                  df -k /tmp 2>/dev/null

                  echo '[OK] Cleanup concluido'
                  "

                  ssh -i "$KEY_FILE" -p "$ZOS_PORT" -o StrictHostKeyChecking=no \
                    "$ZOS_USER@$ZOS_HOST" "sh -c '$REMOTE_SCRIPT'"

                  rm -f "$KEY_FILE"
