version: 1.0.0

application:
  name: BankofZ

  tasks:
    - task: Cobol
      sources:
        - "**/cics/cobol/*.cbl"
        - "**/ims/cobol/*.cbl"
        - "**/batch/cobol/*.cbl"

      variables:
        - name: dependencySearchPath
          value: search:${WORKSPACE}/?path=${APP_DIR_NAME}/src/base/cics/copy/*.cpy;${APP_DIR_NAME}/src/base/ims/copy/*.cpy
        - name: SIGYCOMP
          value: COBOL.V6R2.SIGYCOMP
        - name: SCEELKED
          value: SYS1.CEE.SCEELKED

    - task: PLI
      sources:
        - "**/src/base/**/*.pli"

      variables:
        - name: dependencySearchPath
          value: search:${WORKSPACE}/?path=${APP_DIR_NAME}/src/base/cics/copy/*.cpy

    - task: Assembler
      sources:
        - "**/PSB/*.asm"
        - "**/DBD/*.asm"

      variables:
        - name: dependencySearchPath
          value: search:${WORKSPACE}/?path=${APP_DIR_NAME}/src/base/ims/copy/*.cpy
