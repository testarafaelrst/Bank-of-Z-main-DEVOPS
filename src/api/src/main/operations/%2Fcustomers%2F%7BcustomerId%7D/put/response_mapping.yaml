---
version: "1.0"
response_403.yaml:
  condition: "$exists($zosAssetResponse.commarea.UPDCUST) and $zosAssetResponse.commarea.UPDCUST.\"COMM-UPD-SUCCESS\" = 'N' and $zosAssetResponse.commarea.UPDCUST.\"COMM-UPD-FAIL-CD\" = 'S'"
  httpStatusCode: 403
response_503.yaml:
  condition: "$exists($zosAssetResponse.commarea.UPDCUST) and $zosAssetResponse.commarea.UPDCUST.\"COMM-UPD-SUCCESS\" = 'N' and $zosAssetResponse.commarea.UPDCUST.\"COMM-UPD-FAIL-CD\" = 'X'"
  httpStatusCode: 503
response_200.yaml:
  condition: "$zosAssetResponse.commarea.UPDCUST.\"COMM-UPD-SUCCESS\" = 'Y'"
  httpStatusCode: 200
response_400.yaml:
  httpStatusCode: 400
response_401.yaml:
  httpStatusCode: 401
response_404.yaml:
  httpStatusCode: 404
response_500.yaml:
  condition: true
  httpStatusCode: 500
