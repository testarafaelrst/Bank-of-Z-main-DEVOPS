---
version: "1.0"
response_403.yaml:
  condition: "$zosAssetResponse.commarea.CRECUSTZ.\"COMM-SUCCESS\" = \"N\" and $zosAssetResponse.commarea.CRECUSTZ.\"COMM-FAIL-CODE\" = \"S\""
  httpStatusCode: 403
response_503.yaml:
  condition: "$zosAssetResponse.commarea.CRECUSTZ.\"COMM-SUCCESS\" = \"N\" and $zosAssetResponse.commarea.CRECUSTZ.\"COMM-FAIL-CODE\" = \"X\""
  httpStatusCode: 503
response_201.yaml:
  condition: "$zosAssetResponse.commarea.CRECUSTZ.\"COMM-SUCCESS\" = \"Y\""
  httpStatusCode: 201
response_400.yaml:
  condition: "$zosAssetResponse.commarea.CRECUSTZ.\"COMM-SUCCESS\" = \"N\""
  httpStatusCode: 400
response_401.yaml:
  httpStatusCode: 401
response_500.yaml:
  condition: true
  httpStatusCode: 500
