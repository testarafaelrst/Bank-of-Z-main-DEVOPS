#
# ZCodeScan configuration file — Bank of Z
#
# This file is the base configuration checked into the repository.
# It is used automatically when no environment-specific config
# ($HOME/zcs_config_file.yml) is found on the z/OS USS system.
#
# To override settings per environment, copy this file to
# $HOME/zcs_config_file.yml and adjust as needed.
#
# Reference: IBM ZCodeScan documentation
################################################################

# Servidor de licença do ZCodeScan.
# IMPORTANTE: este arquivo é o fallback do repositório, usado quando
# $HOME/zcs_config_file.yml não existe no z/OS USS.
# Para ambientes com licença configurada, copie este arquivo para
# $HOME/zcs_config_file.yml e ajuste license_server com o endereço real.
# Formato: <hostname>:<porta>  (ex: licserver.empresa.com:27000)
license_server: "${ZCS_LICENSE_SERVER:-localhost:27000}"

# Source encoding of the COBOL/PL/I files being scanned.
# Fontes mainframe sao convertidos para IBM-1047 (EBCDIC) pelo gitClone.sh.
# O ZCodeScan e chamado com _BPXK_AUTOCVT=OFF para receber bytes EBCDIC brutos.
encoding: IBM-1047

# Maximum return code accepted from the scan (0-8).
# 0 = only violations of severity ERROR cause failure
# 4 = violations of severity WARNING and above cause failure
# 8 = all severities reported but scan never fails the build
maxReturnCode: 4

# Languages to scan
languages:
  - COBOL
  - PLI

# Scan behaviour
options:
  # Stop on first unrecoverable parse error (false = continue scanning all files)
  stopOnError: false
  # Emit progress messages during scan
  verbose: false
  # Include copybook locations in violation messages
  includeCopybooks: true

# Export settings (formats are specified on the command line via -et)
# No additional configuration needed here for sonarqube/junit exports.

# Logging
logging:
  level: INFO
  file: zcodescan.log
